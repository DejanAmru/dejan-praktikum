<!DOCTYPE html>
<html>
<head>
    <title>Konversi Nilai Angka ke Huruf</title>
</head>
<body>

    <h2>Konversi Nilai Angka</h2>
    <p>Masukkan nilai angka (0-100):</p>

    <input type="number" id="nilaiAngka" min="0" max="100">
    <button onclick="konversiNilai()">Konversi</button>
    
    <h3>Nilai Huruf Anda: <span id="hasilKonversi">...</span></h3>

    <script>
        function konversiNilai() {
            // Ambil nilai dari input dan konversi ke bilangan bulat
            const nilai = parseInt(document.getElementById('nilaiAngka').value);
            let nilaiHuruf;

            // Pastikan nilai valid (0-100)
            if (isNaN(nilai) || nilai < 0 || nilai > 100) {
                nilaiHuruf = "Nilai tidak valid!";
            } else if (nilai >= 81) {
                nilaiHuruf = "A";
            } else if (nilai >= 71) {
                nilaiHuruf = "AB";
            } else if (nilai >= 66) {
                nilaiHuruf = "B";
            } else if (nilai >= 61) {
                nilaiHuruf = "BC";
            } else if (nilai >= 56) {
                nilaiHuruf = "C";
            } else if (nilai >= 41) {
                nilaiHuruf = "D";
            } else {
                nilaiHuruf = "E"; // Untuk 0-40
            }

            // Tampilkan hasil
            document.getElementById('hasilKonversi').textContent = nilaiHuruf;
        }
    </script>

</body>
</html>
